name = "iterated_functions"
defaultTargets = ["Main"]

[leanOptions]
autoImplicit = false
pp.unicode.fun = true
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "728a93eeff833da3173895bb0575752fdc24edb0"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "311d27ad8458b61e9b7461fc83a480e4be97aef2"

[[require]]
name = "complexitylib"
git = "https://github.com/SamuelSchlesinger/complexitylib"
rev = "add0aca8ee0d71e68969f2cb45cf91554a50f787"

[[lean_lib]]
name = "Statement"

[[lean_lib]]
name = "Proofs"
globs = ["Proofs.+"]

[[lean_lib]]
name = "Main"
